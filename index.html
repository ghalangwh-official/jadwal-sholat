<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Sholat - Indonesia</title>
  <meta name="description" content="Jadwal waktu sholat untuk seluruh kota di Indonesia. Imsak, Subuh, Dzuhur, Ashar, Maghrib, Isya.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a1628;
      --bg-card: #132338;
      --border: #1e3a5f;
      --text: #e5e9f0;
      --text-dim: #8891a8;
      --accent: #4ade80;
      --accent-dim: #22c55e;
      --warning: #fbbf24;
      --active: #3b82f6;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 40px 0;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 14px;
    }

    /* Search */
    .search-section {
      margin: 40px 0;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }

    .suggestions.active {
      display: block;
    }

    .suggestion-item {
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid var(--border);
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: rgba(74, 222, 128, 0.1);
    }

    .suggestion-item .city-name {
      color: var(--text);
      font-weight: 500;
    }

    .suggestion-item .province {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 2px;
    }

    /* Schedule Card */
    .schedule-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin: 24px 0;
      display: none;
    }

    .schedule-card.active {
      display: block;
    }

    .schedule-header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .schedule-location {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .schedule-date {
      color: var(--text-dim);
      font-size: 14px;
    }

    .prayer-times {
      display: grid;
      gap: 16px;
    }

    .prayer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      transition: all 0.2s;
    }

    .prayer-row.active {
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid var(--accent);
    }

    .prayer-name {
      font-family: 'Amiri', serif;
      font-size: 18px;
      font-weight: 700;
    }

    .prayer-time {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .prayer-row.active .prayer-time {
      color: var(--accent);
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
      display: none;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 0;
      color: var(--text-dim);
      font-size: 14px;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 640px) {
      h1 { font-size: 24px; }
      .schedule-card { padding: 24px; }
      .prayer-name { font-size: 16px; }
      .prayer-time { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">🕌</div>
      <h1>Jadwal Sholat Indonesia</h1>
      <p class="subtitle">Waktu sholat untuk seluruh kota di Indonesia</p>
    </header>

    <section class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          class="search-input" 
          id="citySearch" 
          placeholder="Cari kota atau kabupaten... (contoh: Jakarta, Bandung, Surabaya)"
          autocomplete="off"
        >
        <div class="suggestions" id="suggestions"></div>
      </div>
    </section>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Memuat jadwal sholat...</p>
    </div>

    <div class="schedule-card" id="scheduleCard">
      <div class="schedule-header">
        <div class="schedule-location" id="locationName"></div>
        <div class="schedule-date" id="scheduleDate"></div>
      </div>

      <div class="prayer-times" id="prayerTimes"></div>
    </div>

    <footer>
      <p>Data dari <a href="https://api.myquran.com" target="_blank" rel="noopener">MyQuran API</a></p>
      <p style="margin-top: 8px;">Dibuat dengan ❤️ oleh <a href="https://github.com/ghalangwh-official" target="_blank" rel="noopener">Ghalang</a></p>
    </footer>
  </div>

  <script>
    const API_BASE = 'https://api.myquran.com/v2/sholat';
    let cities = [];
    let currentCity = null;

    // Prayer names mapping
    const prayerNames = {
      imsak: 'Imsak',
      subuh: 'Subuh',
      terbit: 'Terbit',
      dhuha: 'Dhuha',
      dzuhur: 'Dzuhur',
      ashar: 'Ashar',
      maghrib: 'Maghrib',
      isya: 'Isya'
    };

    // Load cities list
    async function loadCities() {
      try {
        const response = await fetch(`${API_BASE}/kota/semua`);
        const data = await response.json();
        cities = data.data || [];
      } catch (error) {
        console.error('Failed to load cities:', error);
      }
    }

    // Search cities
    function searchCities(query) {
      if (!query || query.length < 2) return [];
      
      const lowerQuery = query.toLowerCase();
      return cities.filter(city => 
        city.lokasi.toLowerCase().includes(lowerQuery)
      ).slice(0, 10);
    }

    // Render suggestions
    function renderSuggestions(results) {
      const suggestionsEl = document.getElementById('suggestions');
      
      if (results.length === 0) {
        suggestionsEl.classList.remove('active');
        return;
      }

      suggestionsEl.innerHTML = results.map(city => `
        <div class="suggestion-item" data-id="${city.id}">
          <div class="city-name">${city.lokasi}</div>
        </div>
      `).join('');
      
      suggestionsEl.classList.add('active');
    }

    // Load schedule for a city
    async function loadSchedule(cityId, cityName) {
      const loadingEl = document.getElementById('loading');
      const scheduleEl = document.getElementById('scheduleCard');
      
      loadingEl.classList.add('active');
      scheduleEl.classList.remove('active');

      try {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');

        const response = await fetch(`${API_BASE}/jadwal/${cityId}/${year}/${month}/${day}`);
        const data = await response.json();

        if (data.status && data.data && data.data.jadwal) {
          renderSchedule(data.data, cityName);
        } else {
          throw new Error('Invalid response');
        }
      } catch (error) {
        console.error('Failed to load schedule:', error);
        alert('Gagal memuat jadwal. Silakan coba lagi.');
      } finally {
        loadingEl.classList.remove('active');
      }
    }

    // Render schedule
    function renderSchedule(data, cityName) {
      const scheduleEl = document.getElementById('scheduleCard');
      const locationEl = document.getElementById('locationName');
      const dateEl = document.getElementById('scheduleDate');
      const timesEl = document.getElementById('prayerTimes');

      locationEl.textContent = cityName;
      dateEl.textContent = data.jadwal.tanggal;

      const now = new Date();
      const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      // Render prayer times
      const timesHTML = Object.entries(prayerNames)
        .filter(([key]) => data.jadwal[key])
        .map(([key, name]) => {
          const time = data.jadwal[key];
          const isActive = isCurrentPrayer(time, currentTime);
          
          return `
            <div class="prayer-row ${isActive ? 'active' : ''}">
              <span class="prayer-name">${name}</span>
              <span class="prayer-time">${time}</span>
            </div>
          `;
        }).join('');

      timesEl.innerHTML = timesHTML;
      scheduleEl.classList.add('active');
    }

    // Check if current prayer
    function isCurrentPrayer(prayerTime, currentTime) {
      // Simple check - could be improved with proper time range logic
      return prayerTime === currentTime;
    }

    // Event listeners
    document.getElementById('citySearch').addEventListener('input', (e) => {
      const query = e.target.value;
      const results = searchCities(query);
      renderSuggestions(results);
    });

    document.getElementById('suggestions').addEventListener('click', (e) => {
      const item = e.target.closest('.suggestion-item');
      if (!item) return;

      const cityId = item.dataset.id;
      const cityName = item.querySelector('.city-name').textContent;
      
      document.getElementById('citySearch').value = cityName;
      document.getElementById('suggestions').classList.remove('active');
      
      loadSchedule(cityId, cityName);
    });

    // Close suggestions on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) {
        document.getElementById('suggestions').classList.remove('active');
      }
    });

    // Initialize
    loadCities();

    // Auto-refresh prayer times every minute
    setInterval(() => {
      if (currentCity) {
        const scheduleEl = document.getElementById('scheduleCard');
        if (scheduleEl.classList.contains('active')) {
          // Re-highlight active prayer without reloading
          const now = new Date();
          const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
          
          document.querySelectorAll('.prayer-row').forEach(row => {
            const time = row.querySelector('.prayer-time').textContent;
            if (isCurrentPrayer(time, currentTime)) {
              row.classList.add('active');
            } else {
              row.classList.remove('active');
            }
          });
        }
      }
    }, 60000); // Every minute
  </script>

</body>
</html>
